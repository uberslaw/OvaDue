name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
      - name: Tests
        run: PYTHONPATH=. pytest -q
      - name: Dependency audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

  package-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm package include list ships app modules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rules = json.loads(Path("deploy/package-include.json").read_text())
          needed = {"ovadue", "pages", "app.py", "scripts", "deploy"}
          missing = needed - set(rules["includePaths"])
          assert not missing, f"includePaths missing {missing}"
          print("includePaths ok:", rules["includePaths"])
          PY
